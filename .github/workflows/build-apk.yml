name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply Smart Vision V2
        run: node tools/apply-smart-vision-v2.mjs

      - name: Apply UI Fixes V3
        run: node tools/apply-ui-fixes-v3.mjs

      - name: Verify Smart Vision V2
        run: |
          grep -q "Smart Image Search" src/Prototype.tsx
          grep -q "Analyze image with AI" src/Prototype.tsx
          grep -q "Save & Test Connection" src/Prototype.tsx
          echo "Smart Vision V2 verified"

      - name: Verify UI Fixes V3
        run: |
          grep -q "bookmarks-v3-enter" src/prototype.css
          grep -q "overflow-x: auto" src/prototype.css
          grep -q 'src="/brand/logo-crop.png"' src/Prototype.tsx
          echo "UI Fixes V3 verified"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Build Android app
        run: npm run build:app

      - name: Verify built bundle
        run: |
          grep -R -q "Smart Image Search" dist-app
          grep -R -q "Analyze image with AI" dist-app
          grep -R -q "bookmarks-v3-enter" dist-app
          echo "V2 + V3 verified inside dist-app"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Bookmarks-V3-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14