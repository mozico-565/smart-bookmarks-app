name: Apply Smart Vision Upgrade

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply smart vision patch
        run: node tools/apply-smart-vision.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Build Android app
        run: npm run build:app

      - name: Sync Android
        run: npx cap sync android

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Prototype.tsx src/data.ts src/vision.ts
          git diff --cached --quiet && exit 0
          git commit -m "Add smart visual image search and auto tagging"
          git push
