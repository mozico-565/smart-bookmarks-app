name: Build Bookmarks Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npm run test:data
      - run: npm run build:app
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug
        working-directory: android
      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Bookmarks.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Bookmarks-debug-APK
          path: Bookmarks.apk
      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Bookmarks.apk \
            --title "Bookmarks Android APK" \
            --notes "Installable Android build generated from the latest main branch." \
            --latest
